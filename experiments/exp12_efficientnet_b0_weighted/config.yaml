# exp12 - EfficientNet-B0 + augmentation + weighted CrossEntropy.
# Base config: exp11. Changed variable: data.weighted_loss only.

experiment:
  id: "exp12"
  name: "efficientnet_b0_weighted"
  description: "EfficientNet-B0 with train-only augmentation and weighted CrossEntropy"

model:
  name: "efficientnet_b0"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle.csv"
  augmentation: true
  weighted_loss: true

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  lr_full: 5.0e-5
  weight_decay: 1.0e-2
  seed: 42

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp12_efficientnet_b0_weighted"
  wandb_mode: "disabled"

output:
  checkpoint_path: "checkpoints/exp12_best.pt"
  results_dir: "experiments/exp12_efficientnet_b0_weighted/results/"