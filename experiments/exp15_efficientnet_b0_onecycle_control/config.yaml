# exp15 - EfficientNet-B0 baseline + OneCycleLR control.
# Base config: exp03. Changed variable: full fine-tuning scheduler only.

experiment:
  id: "exp15"
  name: "efficientnet_b0_onecycle_control"
  description: "EfficientNet-B0 baseline without augmentation or class weights, using OneCycleLR after head warmup"

model:
  name: "efficientnet_b0"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle.csv"
  augmentation: false
  weighted_loss: false

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  onecycle_max_lr: 5.0e-4
  onecycle_pct_start: 0.1
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 1.0e-2
  seed: 42

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp15_efficientnet_b0_onecycle_control"
  wandb_mode: "disabled"

output:
  checkpoint_path: "checkpoints/exp15_best.pt"
  results_dir: "experiments/exp15_efficientnet_b0_onecycle_control/results/"
