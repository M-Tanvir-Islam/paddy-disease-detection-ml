# exp19 - exp16 recipe repeated with seed 1 to measure seed-to-seed variance.
# The only experimental variable relative to exp16 is training.seed.

experiment:
  id: "exp19"
  name: "mobilenetv3large_seed_replicates_seed1"
  description: "exp16 MobileNetV3-Large recipe on kaggle_grouped_v2 with seed 1"

model:
  name: "mobilenet_v3_large"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle_grouped_v2.csv"
  split_version: "kaggle_grouped_v2"
  augmentation: true
  weighted_loss: true

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  onecycle_max_lr: 1.5e-3
  onecycle_pct_start: 0.1
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 1.0e-2
  seed: 1

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp19_mobilenetv3large_seed1"
  wandb_mode: "disabled"

output:
  checkpoint_path: "checkpoints/exp19_seed1_best.pt"
  results_dir: "experiments/exp19_mobilenetv3large_seed_replicates/results/seed_1/"
