# exp10 - MobileNetV3-Large input resolution sweep (input_288).
# Base config: exp09 maxlr_15e4. Sweep variable: data.input_size only.

experiment:
  id: "exp10"
  name: "mobilenetv3large_resolution_sweep_input_288"
  description: "MobileNetV3-Large, augmentation + weighted CrossEntropy, OneCycleLR max_lr 1.5e-3, input size 288"

model:
  name: "mobilenet_v3_large"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle.csv"
  input_size: 288
  augmentation: true
  weighted_loss: true

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  onecycle_max_lr: 1.5e-3
  onecycle_pct_start: 0.1
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 1.0e-2
  seed: 42

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp10_mobilenetv3large_resolution_sweep_input_288"
  wandb_mode: "disabled"

output:
  checkpoint_path: "checkpoints/exp10_input_288_best.pt"
  results_dir: "experiments/exp10_mobilenetv3large_resolution_sweep/results/input_288/"