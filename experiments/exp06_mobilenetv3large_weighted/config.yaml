# exp06 - MobileNetV3-Large with augmentation + weighted loss. Phase 2 Track A.
# One-variable change from exp05: enable class-weighted CrossEntropy.
# Augmentation remains enabled so this measures weighted loss on top of augmentation.

experiment:
  id: "exp06"
  name: "mobilenetv3large_weighted"
  description: "MobileNetV3-Large, frozen-then-unfrozen, augmentation enabled, weighted CrossEntropy enabled"

model:
  name: "mobilenet_v3_large"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle.csv"
  augmentation: true
  weighted_loss: true

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  lr_full: 5.0e-5
  weight_decay: 1.0e-2
  seed: 42

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp06_mobilenetv3large_weighted"
  # Change to "online" after `wandb login`. Use "disabled" to skip W&B entirely.
  wandb_mode: "disabled"

output:
  checkpoint_path: "checkpoints/exp06_best.pt"
  results_dir: "experiments/exp06_mobilenetv3large_weighted/results/"