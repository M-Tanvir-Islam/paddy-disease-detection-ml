# exp17 - exp16 recipe plus label smoothing and an EMA of the weights.
# Two closely related regularisation changes relative to exp16; everything
# else (model, split, augmentation, weighted loss, OneCycleLR, seed) is fixed.

experiment:
  id: "exp17"
  name: "mobilenetv3large_smoothing_ema"
  description: "exp16 MobileNetV3-Large recipe with label smoothing 0.1 and EMA weights"

model:
  name: "mobilenet_v3_large"
  source: "torchvision.models"
  pretrained: true
  pretrained_weights: "IMAGENET1K_V1"

data:
  dataset: "kaggle_paddy_2022"
  split_csv: "data/splits/kaggle_grouped_v2.csv"
  split_version: "kaggle_grouped_v2"
  augmentation: true
  weighted_loss: true

training:
  epochs: 40
  batch_size: 64
  warmup_epochs: 5
  lr_head: 3.0e-4
  onecycle_max_lr: 1.5e-3
  onecycle_pct_start: 0.1
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 1.0e-2
  label_smoothing: 0.1
  # EMA decay per optimizer step; ~113 steps/epoch so the horizon is ~9 epochs.
  # The decay is ramped up from 0 over the first few hundred steps.
  ema_decay: 0.999
  seed: 42

hardware:
  num_workers: 4

logging:
  wandb_project: "krishidoc"
  wandb_run_name: "exp17_mobilenetv3large_smoothing_ema"
  wandb_mode: "disabled"

output:
  # The saved checkpoint holds the EMA weights (the deployable model).
  checkpoint_path: "checkpoints/exp17_smoothing_ema_best.pt"
  results_dir: "experiments/exp17_mobilenetv3large_smoothing_ema/results/"
